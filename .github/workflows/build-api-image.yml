# Build API image on GitHub (more RAM than Render free) and push to GHCR.
name: Build API image
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'Dockerfile'
      - '.github/workflows/build-api-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/web-coder-lab/genius-clan-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Make package public (Render can pull)
        run: |
          # Ignore errors if already public or API shape differs
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/genius-clan-api/visibility" \
            -d '{"visibility":"public"}' || true
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/web-coder-lab/packages/container/genius-clan-api/visibility" \
            -d '{"visibility":"public"}' || true
