name: Build Native Compose APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: local.properties
        working-directory: android-native
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug APK
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeniusClan-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk

      - name: Commit APK to releases/
        if: success()
        run: |
          mkdir -p releases
          cp android-native/app/build/outputs/apk/debug/*.apk releases/GeniusClan-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main || true
          git add releases/GeniusClan-debug.apk
          git commit -m "release: GeniusClan debug APK" || exit 0
          git push origin HEAD:main
