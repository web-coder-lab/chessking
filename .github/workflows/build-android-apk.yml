name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug or release'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm install

      - name: Build web (Vite)
        run: npm run build
        env:
          VITE_API_BASE: https://genius-clan-api.onrender.com

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy brand icons into Android res
        run: |
          ICON=resources/icon.png
          if [ -f "$ICON" ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$d
              cp "$ICON" android/app/src/main/res/$d/ic_launcher.png
              cp "$ICON" android/app/src/main/res/$d/ic_launcher_round.png
              cp "$ICON" android/app/src/main/res/$d/ic_launcher_foreground.png
            done
          fi
          if [ -f resources/splash.png ]; then
            mkdir -p android/app/src/main/res/drawable
            cp resources/splash.png android/app/src/main/res/drawable/splash.png
          fi

      - name: Decode release keystore (optional)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/genius-clan.jks
            echo "KEYSTORE_PATH=/tmp/genius-clan.jks" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — will try assembleRelease unsigned/debug sign"
          fi

      - name: Prepare version + signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/android-release-prep.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: genius-clan-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: genius-clan-release-apk
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/release/*.aab
