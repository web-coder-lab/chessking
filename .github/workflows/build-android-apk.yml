name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JS deps
        run: npm install

      - name: Build web (Vite)
        run: npm run build
        env:
          VITE_API_BASE: https://genius-clan-api.onrender.com

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy brand icons into Android res
        run: |
          ICON=resources/icon.png
          if [ -f "$ICON" ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$d
              cp "$ICON" android/app/src/main/res/$d/ic_launcher.png
              cp "$ICON" android/app/src/main/res/$d/ic_launcher_round.png
              cp "$ICON" android/app/src/main/res/$d/ic_launcher_foreground.png
            done
          fi
          if [ -f resources/splash.png ]; then
            mkdir -p android/app/src/main/res/drawable
            cp resources/splash.png android/app/src/main/res/drawable/splash.png
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genius-clan-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
