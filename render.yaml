# Genius Clan — API ONLY (native Android client)
# Durable DB = GitHub repo folder chess/ (database_id dstabase7837638362826373)
# Render keeps no permanent user data files.

services:
  - type: web
    name: genius-clan-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: "sqlite::memory:"
      - key: FRONTEND_BASE_URL
        value: https://genius-clan-api.onrender.com
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CORS_EXTRA_ORIGINS
        value: ""
      - key: CLIENT_MODE
        value: "native_android"
      - key: GITHUB_DATA_OWNER
        value: "web-coder-lab"
      - key: GITHUB_DATA_REPO
        value: "chessking"
      - key: GITHUB_DATA_BRANCH
        value: "main"
      - key: GITHUB_DATA_ROOT
        value: "chess"
      # Set in Render dashboard only (never commit):
      # GITHUB_DATA_TOKEN = GitHub PAT with repo scope
      - key: SMTP_HOST
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
