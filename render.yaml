# Genius Clan — API-only server (mobile / APK clients)
# Frontend is NOT served from this service. Static web (optional) is separate.

services:
  - type: web
    name: genius-clan-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: sqlite:///data/genius_clan.db
      - key: FRONTEND_BASE_URL
        # Optional web SPA; APK uses Capacitor origin
        value: https://genius-clan.onrender.com
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CORS_EXTRA_ORIGINS
        # Capacitor / local Android WebView origins (comma-separated)
        value: "https://localhost,capacitor://localhost,http://localhost,http://localhost:5173"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""

  # Optional public web SPA — disable/delete this service if APK-only.
  # - type: web
  #   name: genius-clan
  #   runtime: static
  #   ...
