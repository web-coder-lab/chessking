# Genius Clan — final attach: API + Frontend (separate services)

services:
  # ---------- API (Rust) — mobile + web clients ----------
  - type: web
    name: genius-clan-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: sqlite:///data/genius_clan.db
      - key: FRONTEND_BASE_URL
        value: https://genius-clan.onrender.com
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CORS_EXTRA_ORIGINS
        value: "https://genius-clan.onrender.com,https://localhost,capacitor://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""

  # ---------- Frontend (static SPA) → talks to API ----------
  - type: web
    name: genius-clan
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://genius-clan-api.onrender.com
      - key: VITE_WS_BASE
        value: wss://genius-clan-api.onrender.com
