# Genius Clan — API ONLY (native Android / Jetpack Compose client)
# No website is deployed from this blueprint.

services:
  - type: web
    name: genius-clan-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: sqlite:///data/genius_clan.db
      # Deep links / email links point to API docs or future store listing
      - key: FRONTEND_BASE_URL
        value: https://genius-clan-api.onrender.com
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CORS_EXTRA_ORIGINS
        value: ""
      - key: CLIENT_MODE
        value: "native_android"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
